# fly.toml app configuration file generated for teerankio-bullboard on 2024-11-29T16:14:52+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'teerankio-bullboard'
primary_region = 'cdg'

[build]
  image = 'venatum/bull-board'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
