version: '3.8'

services:
  postgres:
    image: postgres:latest
    ports:
      - "5452:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: teerank
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all -c max_connections=200
    restart: always

  redis:
    image: redis:latest
    ports:
      - "6399:6379"
    restart: always

  bullboard:
    container_name: bullboard
    image: venatum/bull-board
    restart: always
    ports:
      - 3000:3000
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USE_TLS: 'false'
      BULL_PREFIX: bull
    depends_on:
      - redis

  pghero:
    image: ankane/pghero
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/teerank
    depends_on:
      - postgres
